<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Simulated water caustics for light gobos: underwater, overhead and hull reflections, seamless and loopable.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cucoloris Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lighting-workbench — square gobo plate dominates the left, a parameter rail runs down the right; stacks on phones */
:root{
  --bg:#0e1115;
  --panel:#141920;
  --raise:#1b2129;
  --line:#27303b;
  --fg:#dfe5ec;
  --mute:#8994a2;
  --accent:#f0b25e;      /* tungsten 3200K */
  --accent-ink:#1b1206;
  --sky:#9fbef5;         /* daylight 5600K, used for info readouts */
  --warn:#e4806b;
  --f-disp:'Archivo', 'Arial Narrow', system-ui, sans-serif;
  --f-ui:'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Consolas, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:13px;}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{
  height:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) 360px;
  grid-template-rows:auto minmax(0,1fr);
  gap:0 18px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 12px;
}
.top{
  grid-column:1 / -1;
  display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:14px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.mark{width:26px;height:26px;border-radius:50%;flex:none;
  background:
    radial-gradient(circle at 34% 38%, var(--bg) 0 3px, transparent 3.5px),
    radial-gradient(circle at 64% 30%, var(--bg) 0 2px, transparent 2.5px),
    radial-gradient(circle at 58% 66%, var(--bg) 0 4px, transparent 4.5px),
    radial-gradient(circle at 30% 70%, var(--bg) 0 2px, transparent 2.5px),
    var(--accent);
}
.brand h1{margin:0;font-family:var(--f-disp);font-stretch:68%;font-weight:760;font-size:22px;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.brand p{margin:3px 0 0;color:var(--mute);font-size:12px}
.modes{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;flex-wrap:wrap}
.mode{background:none;border:0;padding:7px 14px;border-radius:6px;cursor:pointer;color:var(--mute);font-weight:560;font-stretch:88%;letter-spacing:.02em}
.mode:hover{color:var(--fg)}
.mode[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

.stage{display:flex;flex-direction:column;gap:10px;min-width:0;min-height:0}
.plate{position:relative;flex:1;min-height:0;display:grid;place-items:center;
  background:
    linear-gradient(var(--line) 1px, transparent 1px) 0 0/40px 40px,
    linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/40px 40px,
    #0a0c0f;
  border:1px solid var(--line);border-radius:6px;overflow:hidden}
#cv{display:block;background:#000;box-shadow:0 0 0 1px #000, 0 10px 40px rgba(0,0,0,.6)}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.chip{font-family:var(--f-mono);font-size:11px;background:rgba(10,12,15,.78);border:1px solid var(--line);padding:3px 7px;border-radius:4px;color:var(--mute);font-variant-numeric:tabular-nums}
.chip.ok{color:var(--sky)}
.err{position:absolute;inset:auto 10px 10px 10px;background:#2a1712;border:1px solid var(--warn);color:#f6d2c8;padding:10px 12px;border-radius:6px;font-family:var(--f-mono);font-size:11.5px;white-space:pre-wrap;max-height:50%;overflow:auto}

.transport{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
.ib{width:30px;height:30px;display:grid;place-items:center;border-radius:6px;border:1px solid var(--line);background:var(--raise);cursor:pointer;flex:none}
.ib:hover{border-color:var(--mute)}
.ib.play{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ib svg{width:14px;height:14px}
.tc{font-family:var(--f-mono);font-size:11.5px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums;min-width:150px;text-align:right}
.viewbar{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;color:var(--mute);font-size:12px}
.viewbar label{display:flex;align-items:center;gap:6px}
.viewbar select{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.tog{display:flex;align-items:center;gap:6px;cursor:pointer}
.tog input{accent-color:var(--accent)}

/* sliders */
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;cursor:pointer;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--accent) 0 var(--pct,50%),var(--line) var(--pct,50%) 100%)}
input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--fg);border:2px solid var(--bg);margin-top:-5px;box-shadow:0 0 0 1px var(--line)}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:var(--fg);border:2px solid var(--bg)}
#scrub{flex:1;min-width:60px}

.rail{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-right:4px;padding-bottom:20px}
.sect-label{font-family:var(--f-disp);font-stretch:75%;font-weight:640;text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--mute)}
.presets{display:flex;flex-direction:column;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.pchip{background:var(--raise);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer;font-size:12px}
.pchip:hover{border-color:var(--accent);color:var(--accent)}
.pchip.alt{background:none;color:var(--mute)}
details.grp{background:var(--panel);border:1px solid var(--line);border-radius:8px}
details.grp > summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
details.grp > summary::-webkit-details-marker{display:none}
details.grp > summary::after{content:"";width:7px;height:7px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg) translateY(-2px);transition:transform .15s}
details.grp:not([open]) > summary::after{transform:rotate(-45deg)}
.ctrls{display:flex;flex-direction:column;gap:9px;padding:0 12px 12px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center}
.row > label{color:var(--fg);font-size:12.5px;cursor:default;user-select:none;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row output{font-family:var(--f-mono);font-size:11.5px;color:var(--accent);font-variant-numeric:tabular-nums}
.row input[type=range]{grid-column:1 / -1}
.row select{background:var(--raise);border:1px solid var(--line);border-radius:5px;padding:4px 6px;max-width:170px}
.row.chk input{accent-color:var(--accent);width:16px;height:16px}
.info{font-family:var(--f-mono);font-size:11px;line-height:1.6;color:var(--sky);background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:9px 12px;white-space:pre-wrap}
.hint{color:var(--mute);font-size:11.5px;line-height:1.5;margin:0}
.phint{grid-column:1 / -1;color:var(--mute);font-size:11px;line-height:1.45;margin:2px 0 0}

@media (max-width: 860px){
  html,body{height:auto}
  .app{height:auto;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto auto}
  .stage{min-height:auto}
  .plate{flex:none;aspect-ratio:1/1;max-width:100%}
  .rail{overflow:visible;padding-right:0}
  .tc{min-width:0}
}
@media (prefers-reduced-motion: reduce){ details.grp > summary::after{transition:none} }
</style>
</head>
<body>


<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <span class="mark" aria-hidden="true"></span>
      <div><h1>Cucoloris Lab</h1><p>Simulated water caustics for light gobos · real-time speed · seamless</p></div>
    </div>
    <nav class="modes" id="modes" role="tablist" aria-label="Where the caustics land"></nav>
  </header>

  <section class="stage">
    <div class="plate" id="plate">
      <canvas id="cv" width="512" height="512" aria-label="Gobo preview"></canvas>
      <div class="hud" id="hud"></div>
      <div class="err" id="err" hidden></div>
    </div>
    <div class="transport">
      <button class="ib" id="prev" aria-label="Previous frame"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>
      <button class="ib play" id="play" aria-label="Pause"><svg viewBox="0 0 16 16" fill="currentColor" id="playIcon"><path d="M4 2h3v12H4zM9 2h3v12H9z"/></svg></button>
      <button class="ib" id="next" aria-label="Next frame"><svg viewBox="0 0 16 16" fill="currentColor"><path d="M11 2h2v12h-2zM2 2v12l8-6z"/></svg></button>
      <input type="range" id="scrub" min="0" max="1000" step="1" value="0" aria-label="Loop position">
      <div class="tc" id="tc">0.00 s</div>
    </div>
    <div class="viewbar">
      <label>Preview <select id="vRes"><option value="512">512²</option><option value="1024">1024²</option><option value="2048">2048²</option></select></label>
      <label>Quality <select id="vQual"><option value="draft">Draft</option><option value="high">High</option><option value="ultra">Ultra</option></select></label>
      <label>View <select id="vTiles"><option value="1">Single tile</option><option value="2">2 × 2 tiled</option><option value="3">3 × 3 tiled</option></select></label>
      <label class="tog"><input type="checkbox" id="vHeat"> False color</label>
      <label class="tog"><input type="checkbox" id="vSeams"> Tile borders</label>
    </div>
  </section>

  <aside class="rail" id="rail">
    <div class="presets">
      <span class="sect-label">Presets</span>
      <div class="chips" id="presets"></div>
    </div>
    <div id="groups" style="display:flex;flex-direction:column;gap:12px"></div>
    <div class="info" id="info"></div>
    <details class="grp" open>
      <summary><span class="sect-label">Timeline</span></summary>
      <div class="ctrls" id="timeline"></div>
    </details>
    <p class="hint">Hover a label for what it means physically; double-click it to reset. Space plays and pauses. Speeds default to real time.</p>
  </aside>
</div>

<script>
(() => {
'use strict';
const DEG = Math.PI / 180;
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const $ = id => document.getElementById(id);

/* =====================================================================
   PARAMETER SCHEMA
   One water simulation, three ways to receive its light:
   underwater surfaces (refracted), overhead surfaces (reflected) and
   vertical surfaces at the waterline such as hulls, walls and rocks
   (reflected).
   ===================================================================== */
const SUN_DISK = {k:'sunDisk', l:'Light source Ø', min:0.1, max:6, step:0.01, u:'°', h:'Angular diameter of the light source. The sun is 0.53°. Pool lamps and overcast-thin sun are larger and soften every line.'};
const WATER = name => ({name, params:[
  {k:'tileSize', l:'Tile size', min:0.5, max:20, step:0.1, u:'m', h:'Real-world width of one tile. Every other size here is physical.'},
  {k:'wavelength', l:'Dominant wavelength', min:0.03, max:5, step:0.01, u:'m', h:'Peak of the wave spectrum. Sets the size of the caustic cells and, through the dispersion relation, how fast they move.'},
  {k:'slope', l:'Surface slope (RMS)', min:0.003, max:0.2, step:0.001, h:'Root-mean-square slope of the waves. Glassy water is below 0.02, still pools 0.03–0.05, open water in a breeze 0.08–0.15.'},
  {k:'tail', l:'Short-wave content', min:0, max:1, step:0.01, h:'Energy in waves shorter than the dominant ones. Low for still pools that only carry gentle residual swell; high for wind-driven water, where short waves crowd the caustics into fine mesh.'},
  {k:'peak', l:'Wave regularity', min:1, max:7, step:0.1, h:'JONSWAP peak enhancement. 1 = broad, irregular wind sea. 7 = narrow, regular swell.'},
  {k:'directional', l:'Directionality', min:0, max:1, step:0.01, h:'0 = waves from every direction. 1 = waves aligned with the wave direction.'},
  {k:'windDir', l:'Wave direction', min:0, max:360, step:1, u:'°'},
  {k:'opposing', l:'Reflected waves', min:0, max:1, step:0.01, h:'Waves bouncing back off pool walls, hulls or a seawall. Turns travelling patterns into ones that shimmer in place.'},
  {k:'ripple', l:'Wind ripples (RMS slope)', min:0, max:0.15, step:0.001, h:'Capillary ripples 1–4 cm long raised by gusts. They flicker fast and add fine sparkle.'},
  {k:'chop', l:'Crest sharpening', min:0, max:1, step:0.01, h:'Choppy (Gerstner) horizontal displacement from the simulation.'},
]});
const MOTION = {name:'Motion', params:[
  {k:'timeScale', l:'Time scale', min:0.05, max:2, step:0.01, u:'×', h:'1 = real speed from the gravity–capillary dispersion relation. Lower it only as a deliberate art-direction choice.'},
]};
const WATER_TYPES = [
  {name:'Pool (fresh, treated)', sal:0, b:0.01},
  {name:'Clear ocean', sal:35, b:0.03},
  {name:'Coastal', sal:33, b:0.3},
  {name:'Turbid coastal', sal:30, b:1.0},
  {name:'Lake or river', sal:0, b:0.8},
];
const LEVELS = {exposure:-1.3, rolloff:0.35, gamma:1, contrast:0, black:0, white:1, floor:0, invert:false};

const MODES = {
  under: {
    short:'Underwater', target:0, tileable:true, tl:{loop:true, len:10, shutter:180},
    groups:[
      WATER('Water surface'),
      {name:'Light path', params:[
        {k:'depth', l:'Depth below surface', min:0.1, max:15, step:0.05, u:'m', h:'Distance from the water surface to the surface receiving the caustics.'},
        {k:'sunElev', l:'Sun elevation (in air)', min:10, max:90, step:0.5, u:'°'},
        {k:'sunAz', l:'Sun azimuth', min:0, max:360, step:1, u:'°'},
        SUN_DISK,
        {k:'waterType', l:'Water', opts:WATER_TYPES.map(w => w.name), h:'Sets salinity (which shifts the refractive index) and the scattering coefficient of the water column.'},
        {k:'scatterK', l:'Scattering', min:0, max:4, step:0.01, u:'×', h:'Scales the water type’s scattering coefficient. Light scattered out of each ray spreads into a soft forward halo and lowers caustic contrast with depth.'},
        {k:'dispersion', l:'Dispersion', min:0, max:5, step:0.05, u:'×', h:'Wavelength-dependent refraction from the measured index of refraction of water (Quan–Fry). 1 = real water. Colour fringes appear only where they exceed a pixel.'},
        {k:'bakeColor', l:'Bake water absorption into colour', type:'chk', h:'Applies pure-water spectral absorption along each ray’s path. Leave off when your scene’s water volume already absorbs the light.'},
      ]},
      MOTION,
    ],
    presets:[
      {name:'Pool, still air', v:{seed:7, tileSize:3, wavelength:0.32, slope:0.05, tail:0.3, peak:1.2, directional:0.15, windDir:30, opposing:0.55, ripple:0, chop:0.2, depth:1.5, sunElev:62, sunAz:40, sunDisk:0.53, waterType:0, scatterK:1, dispersion:1, bakeColor:false, timeScale:1}},
      {name:'Pool, light breeze', v:{tileSize:2, wavelength:0.14, slope:0.032, tail:0.45, peak:1.4, directional:0.5, opposing:0.25, ripple:0.006, depth:1.3}},
      {name:'Pool, deep end', v:{tileSize:4, wavelength:0.32, slope:0.045, tail:0.3, depth:3.2}},
      {name:'Shallows, 25 cm', v:{tileSize:1.5, wavelength:0.13, slope:0.07, tail:0.2, peak:1.3, directional:0.35, opposing:0.1, ripple:0, depth:0.25, sunElev:55, waterType:4}},
      {name:'Indoor pool, lamps', v:{tileSize:3, wavelength:0.35, slope:0.04, tail:0.2, opposing:0.7, depth:1.6, sunElev:80, sunDisk:3}},
      {name:'Tropical shallows', v:{tileSize:6, wavelength:0.8, slope:0.065, tail:0.35, peak:2.5, directional:0.6, opposing:0.1, ripple:0.004, depth:2.2, waterType:1}},
      {name:'Reef at 6 m', v:{tileSize:12, wavelength:2.4, slope:0.08, tail:0.45, peak:2.5, directional:0.5, opposing:0, ripple:0.003, depth:6, waterType:2}},
    ],
    post:{...LEVELS},
  },
  over: {
    short:'Overhead (reflected)', target:1, tileable:true, tl:{loop:true, len:10, shutter:180},
    groups:[
      WATER('Water surface'),
      {name:'Light path', params:[
        {k:'depth', l:'Height above water', min:0.1, max:15, step:0.05, u:'m', h:'Height of the ceiling, dock or hull underside above the water.'},
        {k:'sunElev', l:'Sun elevation', min:10, max:85, step:0.5, u:'°'},
        {k:'sunAz', l:'Sun azimuth', min:0, max:360, step:1, u:'°'},
        SUN_DISK,
      ]},
      MOTION,
    ],
    presets:[
      {name:'Under a dock', v:{seed:5, tileSize:4, wavelength:0.9, slope:0.013, tail:0.2, peak:2, directional:0.4, windDir:20, opposing:0.3, ripple:0, chop:0.2, depth:1.8, sunElev:35, sunAz:40, sunDisk:0.53, timeScale:1}},
      {name:'Bridge underside', v:{tileSize:10, wavelength:1.6, slope:0.012, tail:0.3, peak:2.5, directional:0.7, opposing:0, depth:5, sunElev:30}},
      {name:'Boat overhang, choppy', v:{tileSize:3, wavelength:0.5, slope:0.03, tail:0.5, peak:1.5, directional:0.3, opposing:0.4, ripple:0.004, depth:0.8, sunElev:45}},
      {name:'Indoor pool ceiling', v:{tileSize:6, wavelength:0.4, slope:0.012, tail:0.1, opposing:0.7, depth:3.5, sunElev:60, sunDisk:3}},
    ],
    post:{...LEVELS},
  },
  hull: {
    short:'Hull & walls (reflected)', target:2, tileable:false, tl:{loop:true, len:10, shutter:180},
    groups:[
      WATER('Water surface'),
      {name:'Light path', params:[
        {k:'sunElev', l:'Sun elevation', min:5, max:75, step:0.5, u:'°', h:'Lower sun stretches the pattern into horizontal bands; higher sun stretches it upward.'},
        {k:'sunAz', l:'Sun angle to the wall', min:-75, max:75, step:0.5, u:'°', h:'0 = the sun faces the wall squarely across the water.'},
        {k:'lean', l:'Surface lean', min:-30, max:50, step:0.5, u:'°', h:'Positive leans the surface out over the water, like a flared bow; negative leans it away, like a sloping rock.'},
        SUN_DISK,
      ]},
      MOTION,
    ],
    presets:[
      {name:'Yacht hull, harbour', v:{seed:9, tileSize:3, wavelength:0.7, slope:0.015, tail:0.35, peak:1.4, directional:0.1, windDir:60, opposing:0.5, ripple:0, chop:0.2, sunElev:50, sunAz:15, lean:15, sunDisk:0.53, timeScale:1}},
      {name:'Seawall, choppy', v:{tileSize:4, wavelength:1.2, slope:0.026, tail:0.45, peak:1.4, directional:0.4, opposing:0.6, ripple:0, sunElev:40, sunAz:-15, lean:0}},
      {name:'Rock face by a lake', v:{tileSize:3, wavelength:0.45, slope:0.02, tail:0.35, directional:0.15, windDir:45, opposing:0.1, sunElev:45, sunAz:20, lean:-8}},
      {name:'Pool wall above water', v:{tileSize:1.5, wavelength:0.25, slope:0.015, tail:0.25, opposing:0.7, sunElev:55, sunAz:0, lean:0}},
      {name:'Low sun bands', v:{tileSize:2, wavelength:0.6, slope:0.012, tail:0.25, opposing:0.4, sunElev:22, sunAz:10, lean:0}},
    ],
    post:{...LEVELS},
  },
};

const POST = [
  {k:'exposure', l:'Preview exposure', min:-6, max:4, step:0.05, u:'EV', h:'Preview only. The pattern itself is linear with a mean of 1.0, so it redistributes the light without dimming it.'},
  {k:'rolloff', l:'Highlight rolloff', min:0, max:1, step:0.01, h:'Compresses hot caustic peaks instead of clipping them.'},
  {k:'gamma', l:'Gamma', min:0.3, max:3, step:0.01},
  {k:'contrast', l:'S-curve', min:0, max:1, step:0.01},
  {k:'black', l:'Black point', min:0, max:0.5, step:0.005},
  {k:'white', l:'White point', min:0.2, max:2, step:0.01},
  {k:'floor', l:'Ambient fill', min:0, max:0.5, step:0.005, h:'Lifts the darkest value so the gobo never fully blocks the light.'},
  {k:'invert', l:'Invert', type:'chk'},
];

const DEFAULTS = {};
for (const [m, def] of Object.entries(MODES)) DEFAULTS[m] = {...def.presets[0].v};

/* =====================================================================
   STATE (+ per-viewer persistence)
   ===================================================================== */
const small = Math.min(innerWidth, innerHeight) < 700 || matchMedia('(pointer:coarse)').matches;
const S = {
  mode:'under', p:{}, post:{}, tl:{}, fps:24, t:0, playing:true,
  res: small ? 512 : 1024, quality: small ? 'draft' : 'high', tiles:1, heat:false, seams:false,
};
for (const m of Object.keys(MODES)) { S.p[m] = {...DEFAULTS[m]}; S.post[m] = {...MODES[m].post}; S.tl[m] = {...MODES[m].tl}; }

              receiving plane. Brightness = source area / landed area. ---------- */

    sel.value = store[def.k];
    sel.onchange = () => { store[def.k] = +sel.value; onChange(def.k); };
    row.append(sel);
  } else if (def.type === 'chk') {
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.id = id; cb.checked = !!store[def.k];
    cb.onchange = () => { store[def.k] = cb.checked; onChange(def.k); };
    row.append(cb);
  } else {
    const out = document.createElement('output'); out.htmlFor = id;
    const rg = document.createElement('input');
    rg.type = 'range'; rg.id = id;
    const toSlider = v => def.log ? 1000 * Math.log(v / def.min) / Math.log(def.max / def.min) : v;
    const fromSlider = x => def.log ? Math.round(def.min * Math.pow(def.max / def.min, x / 1000) / def.step) * def.step : +x;
    if (def.log) { rg.min = 0; rg.max = 1000; rg.step = 1; } else { rg.min = def.min; rg.max = def.max; rg.step = def.step; }
    rg.value = toSlider(store[def.k]);
    out.textContent = fmtVal(def, store[def.k]);
    setPct(rg);
    rg.oninput = () => { store[def.k] = fromSlider(rg.value); out.textContent = fmtVal(def, store[def.k]); setPct(rg); onChange(def.k); };
    lab.ondblclick = () => { if (dflt && dflt[def.k] !== undefined) { rg.value = toSlider(dflt[def.k]); rg.oninput(); } };
    row.append(out, rg);
  }
  if (def.h && def.showHint) { const h = document.createElement('p'); h.className = 'phint'; h.textContent = def.h; row.append(h); }
  return row;
}
const changed = () => { dirty = true; save(); };

function buildModes() {
  const nav = $('modes'); nav.innerHTML = '';
  for (const [k, m] of Object.entries(MODES)) {
    const b = document.createElement('button');
    b.className = 'mode'; b.setAttribute('role', 'tab'); b.id = 'mode-' + k; b.textContent = m.short;
    b.setAttribute('aria-selected', k === S.mode);
    b.onclick = () => { S.mode = k; S.t = S.t % TL().len; buildModes(); buildPanel(); buildTimeline(); changed(); };
    nav.append(b);
  }
}
function buildPanel() {
  const m = MODES[S.mode], store = S.p[S.mode];
  const pr = $('presets'); pr.innerHTML = '';
  m.presets.forEach(ps => {
    const b = document.createElement('button'); b.className = 'pchip'; b.textContent = ps.name;
    b.onclick = () => { S.p[S.mode] = {...DEFAULTS[S.mode], ...ps.v, seed:S.p[S.mode].seed}; buildPanel(); changed(); };
    pr.append(b);
  });
  const rs = document.createElement('button'); rs.className = 'pchip alt'; rs.textContent = 'New seed';
  rs.onclick = () => { S.p[S.mode].seed = 1 + Math.floor(Math.random() * 9999); buildPanel(); changed(); };
  pr.append(rs);
  const groups = $('groups'); groups.innerHTML = '';
  const mk = (title, defs, st, dflt, open = true) => {
    const d = document.createElement('details'); d.className = 'grp'; d.open = open;
    const s = document.createElement('summary'); s.innerHTML = '<span class="sect-label"></span>'; s.firstChild.textContent = title;
    const c = document.createElement('div'); c.className = 'ctrls';
    defs.forEach(def => c.append(control(def, st, S.mode + (st === store ? '' : '-post'), dflt, changed)));
    d.append(s, c); groups.append(d);
  };
  m.groups.forEach(g => mk(g.name, g.params, store, DEFAULTS[S.mode]));
  mk('Output levels', POST, S.post[S.mode], MODES[S.mode].post, false);
}
function buildTimeline() {
  const tl = TL(), box = $('timeline'); box.innerHTML = '';
  const defs = [
    {k:'loop', l:'Seamless loop', type:'chk', showHint:true, h:'Every frequency snaps to whole cycles of the loop, so the last frame flows into the first.'},
    {k:'len', l:tl.loop ? 'Loop length' : 'Sequence length', min:1, max:1800, step:0.5, log:true, fmt:fmtLen},
    {k:'shutter', l:'Motion blur', opts:['Off', '90° shutter', '180° shutter (film)', '270° shutter', '360° shutter'], vals:[0, 90, 180, 270, 360], h:'Averages sub-frames across the shutter interval, as a real camera does. Draft quality skips it.'},
  ];
  defs.forEach(def => box.append(control(def, tl, 'tl-' + S.mode, MODES[S.mode].tl, k => {
    if (k === 'loop') buildTimeline();
    if (k === 'len') S.t = S.t % tl.len;
    changed();
  })));
  box.append(control({k:'fps', l:'Frame rate', opts:['24', '25', '30', '48', '60'], vals:[24, 25, 30, 48, 60]}, S, 'tl', {fps:24}, changed));

}

// view controls
const vRes = $('vRes'), vQual = $('vQual'), vTiles = $('vTiles'), vHeat = $('vHeat'), vSeams = $('vSeams');
vRes.value = S.res; vQual.value = S.quality; vTiles.value = S.tiles;
vRes.onchange = () => { S.res = +vRes.value; changed(); };
vQual.onchange = () => { S.quality = vQual.value; changed(); };
vTiles.onchange = () => { S.tiles = +vTiles.value; changed(); };
vHeat.onchange = () => { S.heat = vHeat.checked; dirty = true; };
vSeams.onchange = () => { S.seams = vSeams.checked; dirty = true; };

// transport
const playBtn = $('play'), scrub = $('scrub'), tc = $('tc');
const ICON_PAUSE = '<path d="M4 2h3v12H4zM9 2h3v12H9z"/>', ICON_PLAY = '<path d="M4 2l10 6-10 6z"/>';
function setPlaying(v) {
  S.playing = v; $('playIcon').innerHTML = v ? ICON_PAUSE : ICON_PLAY;
  playBtn.setAttribute('aria-label', v ? 'Pause' : 'Play');
}
playBtn.onclick = () => setPlaying(!S.playing);
function stepFrame(d) {
  setPlaying(false);
  const total = Math.max(1, Math.round(TL().len * S.fps));
  const f = Math.floor(S.t * S.fps + 1e-6);
  S.t = (((f + d) % total + total) % total) / S.fps; dirty = true;
}
$('prev').onclick = () => stepFrame(-1);
$('next').onclick = () => stepFrame(1);
scrub.oninput = () => { setPlaying(false); S.t = scrub.value / 1000 * TL().len; dirty = true; };
document.addEventListener('keydown', ev => {
  const ae = document.activeElement;
  if (ev.code !== 'Space') return;
  if (ae && (/SELECT|BUTTON|TEXTAREA/.test(ae.tagName) || (ae.tagName === 'INPUT' && ae.type !== 'range'))) return;
  ev.preventDefault(); setPlaying(!S.playing);
});
function updateTransport() {
  const len = TL().len;
  const total = Math.max(1, Math.round(len * S.fps));
  const f = Math.min(total - 1, Math.floor(S.t * S.fps + 1e-6));
  tc.textContent = `${S.t.toFixed(2)} s · frame ${f + 1}/${total}`;
  scrub.value = Math.round(S.t / len * 1000); setPct(scrub);
}

// canvas sizing
const plate = $('plate');
function fit() {
  const r = plate.getBoundingClientRect();
  const css = Math.max(120, Math.floor(Math.min(r.width, r.height) - 24));
  cv.style.width = css + 'px'; cv.style.height = css + 'px';
  const px = Math.min(2048, Math.round(css * (window.devicePixelRatio || 1)));
  if (cv.width !== px) { cv.width = px; cv.height = px; }
  dirty = true;
}
new ResizeObserver(fit).observe(plate);

// HUD
const hud = $('hud');
function updateHud(ms) {
  const m = MODES[S.mode], tl = TL();
  hud.innerHTML = '';
  const add = (txt, cls) => { const c = document.createElement('span'); c.className = 'chip' + (cls ? ' ' + cls : ''); c.textContent = txt; hud.append(c); };
  add(`${S.res}²`);
  add(ms ? `${ms.toFixed(0)} ms/frame` : 'paused');
  add(m.tileable ? 'Seamless tile' : 'Tiles sideways', 'ok');
  add(tl.loop ? `Loop ${fmtLen(tl.len)}` : `Sequence ${fmtLen(tl.len)}`, tl.loop ? 'ok' : '');
  if (tl.shutter > 0 && QUAL[S.quality].sub > 1) add(`${tl.shutter}° shutter`);
}


/* =====================================================================
   LOOP
   ===================================================================== */
let dirty = true, last = performance.now(), msAvg = 0, hudTimer = 0;
function tick(now) {
  const dt = clamp((now - last) / 1000, 0, 0.1); last = now;
  const len = TL().len;
  if (S.playing) { S.t = (S.t + dt) % len; dirty = true; }
  if (dirty) {
    dirty = false;
    const t0 = performance.now();
    try { render(); } catch (e) { console.error(e); showErr(String(e && e.stack || e)); }
    updateTransport();
    $('info').textContent = info;
    const cost = performance.now() - t0;
    msAvg = msAvg ? msAvg * 0.85 + cost * 0.15 : cost;
  }
  if (now - hudTimer > 500) { hudTimer = now; updateHud(S.playing ? msAvg : 0); }
  requestAnimationFrame(tick);
}

buildModes(); buildPanel(); buildTimeline(); fit(); setPlaying(true); updateHud(0);
window.__cuc = {S, render: () => { render(); $('info').textContent = info; }, gl, runFFT, tgt, PR, pass, dataTex, tex, i1, f1};
requestAnimationFrame(tick);
})();

</script>

</body>
